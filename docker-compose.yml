

services:
  postgres:
    image: postgres:17
    container_name: competitor-postgres
    restart: always

    environment:
      POSTGRES_DB: competitor_analysis
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - competitor-network

volumes:
  postgres_data:

networks:
  competitor-network:
    driver: bridge